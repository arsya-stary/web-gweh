<head>
    <link rel="stylesheet" href="style.css"/>

</head>

<main class="page">
    <div class="card">

        <span class="tag">Private Archive</span>

        <h1>Future Message</h1>

        <p class="description">
            This message was written by your past self.
            It isn't for anyone else.
            If you're really me, answer the question below.
        </p>

        <form id="loginForm">

            <label>Password</label>

            <input
                id="password"
                type="password"
                placeholder="Type your answer..."
                autocomplete="off"
            >

            <button type="submit">
                check
            </button>

        </form>

        <small class="hint">
            Hint : jika aku ingin mengupas kabel 2mm apa yang aku butuhkan?
        </small>

        <p id="message"></p>

    </div>
</main>

<script>

const form=document.getElementById("loginForm");

const message=document.getElementById("message");

form.addEventListener("submit",(e)=>{

e.preventDefault();

const answer=document
.getElementById("password")
.value
.trim()
.toLowerCase();

if(answer==="tang potong"){

sessionStorage.setItem("login","true");

window.location="wkwk.html";

}

else{

message.innerHTML="Wrong password.";

message.style.color="#D46D25";

}

});

</script>
