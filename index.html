<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Message</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="eyebrow">Welcome</p>
      <h1>Hello</h1>
      <p class="lead">Gw gatau gimana lu bisa sampe sini</p>
      <p class="lead">Apa pass nya?</p>

      <form class="form" id="loginForm">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Type your answer here" required />
        <button type="submit">Confirm</button>
      </form>

      <p class="hint">hint : jika aku ingin mengupas kabel 2mm apa yang aku butuhkan?</p>
      <p class="message" id="message"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const password = document.getElementById('password').value.trim().toLowerCase();
      const correctAnswer = 'tang potong';

      if (password === correctAnswer) {
        message.textContent = 'Access granted.';
        message.className = 'message success';
        window.location.href = 'isi.html';
      } else {
        message.textContent = 'The password is incorrect. Please try again.';
        message.className = 'message error';
      }
    });
  </script>
</body>
</html>
